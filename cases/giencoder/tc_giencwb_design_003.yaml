id: tc_giencwb_design_003
title: UI设计工作台-填写任务表单并提交
source: |
  口述: 在添加任务弹窗中填写标题（必填）、详细描述（可选），
  选择设计系统，点击"确认添加"后弹窗关闭，
  新任务出现在任务列表，状态显示"执行中"，
  右侧AI对话区开始显示AI执行过程。
req_ref: null
priority: P0
channel: electron
quad:
  actor: 用户
  action: 填写表单并提交设计任务
  object: 任务创建+AI执行
  preconditions:
    - 添加任务弹窗已打开
    - 设计系统已存在
data_ref: null
steps:
  - action: fill
    selector: 'input[placeholder="请输入任务标题"]'
    # [资产修复 2026-11-02] fill 步骤字段名是 value（schema StepFill），原写 text 导致
    # store.load_all() 抛 ValidationError 阻塞全通道批次
    value: "测试任务-设计登录页面"
  - action: fill
    selector: 'textarea[placeholder*="详细描述"]'
    value: "设计一个简洁的用户登录页面，包含用户名和密码输入框和登录按钮"
  - action: click
    selector: 'button.gdw-modal-ds-trigger'
  - action: wait_visible
    selector: 'button.gdw-ds-pill-item'
    timeout_ms: 2000
  - action: click
    selector: 'button.gdw-ds-pill-item:has-text("Ant")'
    # [资产修复 2026-11-02] IR 无 wait_timeout 步骤（executor 亦不支持），
    # 原两处 UI settle 固定等待（500ms/2000ms）移除，断言的 wait 语义由后续 wait_visible 承担
  - action: click
    selector: 'button.gdw-modal-btn.is-primary'
assertions:
  - kind: noul
    # [资产修复 2026-11-02] AssertNoul 必填 question（原只写 comment 不符 schema）
    question: 弹窗已关闭且所选设计系统已生效？
    threshold: 0.9
  - kind: text_visible
    selector: '.gdw-req-card.is-selected'
    expected: 测试任务
  - kind: text_visible
    selector: '.gdw-req-card.is-selected'
    expected: 执行中
postconditions: []
