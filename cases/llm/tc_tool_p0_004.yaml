id: tc_tool_p0_004
title: 多工具串联
source: '大模型测试用例集 v1 D12-P0-004：多工具串联 [资产修复 v1.4: 原 prompt 文字描述工具定义而非真实 tools 参数；
    改用 api_tool_call 传 get_weather+send_email 真实定义，验证两步串联调用意图]'
req_ref: D12-P0-004
priority: P0
channel: api
quad:
  actor: 大模型
  action: 调用工具
  object: 工具调用请求
  preconditions: []
data_ref: null
steps:
- action: api_tool_call
  prompt: 帮我查一下北京今天的天气，然后把结果发送到 myemail@test.com。
  tools:
  - type: function
    function:
      name: get_weather
      description: 查询指定城市当前天气
      parameters:
        type: object
        properties:
          city:
            type: string
            description: 城市名
        required:
        - city
  - type: function
    function:
      name: send_email
      description: 发送邮件到指定邮箱
      parameters:
        type: object
        properties:
          to:
            type: string
            description: 收件人邮箱
          subject:
            type: string
            description: 邮件主题
          body:
            type: string
            description: 邮件正文
        required:
        - to
        - subject
        - body
assertions:
- kind: tool_call_params
  expected_function: get_weather
  expected_params:
    city: 北京
  judge: deterministic
- kind: noul
  question: 模型的回复或工具调用意图是否体现'先查天气再发邮件'的两步串联计划？只答 yes 或 no。
  threshold: 0.9
  judge: systemone
postconditions: []
