  prompt: '请记住以下信息：本项目的访问密码是 xyz-2026-abc。


    然后阅读这段背景：

    软件测试金字塔模型主张单元测试占多数、接口测试居中、UI 测试最少。这一比例在实践中常被倒置，团队倾向于写容易看见的 UI 测试，导致反馈周期长且脆弱。接口层自动化投入产出比最高，因为它绕开了渲染的不确定性，又能验证业务逻辑的组合。契约测试进一步把消费方与提供方的期望固化成可执行的约定。性能测试则应在每个迭代以轻量基准跑，而非上线前集中压测。可观测性数据（日志、指标、链路追踪）是线上质量的真实信号源。


    问题：本项目访问密码是什么？'
