id: tc_ctx_p0_001
title: 长文本信息抽取
source: '大模型测试用例集 v1 D08-P0-001：长文本信息抽取 [数据修复 v1.2: 原prompt为占位描述无真实文章，
    模型无法作答且触发超长thinking导致ReadTimeout——填入固定长文使可判定]'
req_ref: D08-P0-001
priority: P0
channel: api
quad:
  actor: 大模型
  action: 处理长上下文
  object: 长文本输入
  preconditions: []
data_ref: null
steps:
- action: api_call
  prompt: "阅读以下文章，然后回答问题。\n\n【文章】\n现代软件测试正在经历一场范式转变。过去十年，测试团队的主要职责是验证代码是否符合需求文档，工作重心放在编写和执行测试用例上。但随着AI编程工具的普及，代码的生产速度提升了数倍，传统的手工测试节奏已经无法跟上交付速度。\n\n第一代测试自动化解决了一部分问题。Selenium和Playwright等工具让回归测试可以无人值守运行，持续集成流水线也把测试嵌入到了每次提交中。然而，这类自动化依赖精确的选择器和固定数据，维护成本随界面改版线性上升，测试团队常常疲于修复失效的脚本而非发现真正的缺陷。\n\nAI判定技术的出现改变了这个局面。视觉语言模型可以理解页面截图的语义，即使选择器全部失效，它依然能判断页面是否呈现了正确的状态。置信度路由机制则把AI的不确定性纳入管理：高置信度的判定自动通过，低置信度的转人工仲裁，误报被控制在可量化范围内。这意味着断言不再必须用精确的文本匹配来表达。\n\n数据工厂是另一个关键组件。用例与数据分离后，同一套用例可以在不同数据集上重复执行，边界条件和异常场景的覆盖不再依赖测试人员的耐心。快照与回滚机制保证了测试执行不会污染真实数据，这对生产环境附近的测试尤为重要。\n\n当然，这套体系也有代价。AI判定引擎需要标注数据的持续投入，金标准回归成为发布流程的一部分。本地推理对硬件提出了要求，云端判定则带来成本和数据隐私的权衡。团队需要根据被测系统的特性，在确定性断言和AI判定之间找到合适的配比。\n\n展望未来，自然语言到用例的自动生成将进一步降低测试资产的维护成本。测试人员的角色会从用例编写者转变为用例审核者，把精力集中在业务风险的判断上。质量保障的重心也将从功能验证转向质量信号的持续监控。\n\n【问题】\n文章第三段提到的主要观点是什么？"
  system_prompt: null
assertions:
- kind: response_contains
  keywords:
  - AI判定
  - 视觉
  - 置信度
  min_match: 2
- kind: noul
  question: 回答是否正确概括了第三段的核心观点（AI判定技术改变断言方式，视觉模型+置信度路由让断言不必精确文本匹配）？只答 yes 或 no。
  threshold: 0.9
  judge: systemone
postconditions: []
