id: tc_giencwb_003
title: 侧边栏-点击切换侧边栏按钮收起
source: |
  口述: 用户点击顶部的「切换侧边栏」按钮，侧边栏应该收起：
  - sidebar-normal-mode 容器从 DOM 消失
  - body 上的 data-dsh-sidebar-collapsed 属性值变为 "true"
req_ref: null
priority: P0
channel: web
quad:
  actor: 用户
  action: 点击切换侧边栏按钮
  object: sidebar-normal-mode 可见性 + body 属性
  preconditions:
    - "应用已加载"
    - "侧边栏默认展开状态"
data_ref: null
steps:
  - {action: nav, path: "http://localhost:55978/"}
  - {action: wait_visible, selector: '[data-testid="gien-titlebar-tabs"]', timeout_ms: 8000}
  - {action: wait_visible, selector: '[data-testid="sidebar-normal-mode"]', timeout_ms: 5000}
  - {action: click, selector: 'button[aria-label="切换侧边栏"]'}
  - {action: wait_visible, selector: '[data-testid="gien-titlebar-tabs"]', timeout_ms: 3000}
assertions:
  - kind: attribute
    selector: 'body'
    name: data:dsh-sidebar-collapsed
    expected: "__ABSENT__"
postconditions: []