id: tc_giencwb_004
title: 输入框-空状态下发送按钮disabled为true
source: |
  口述: 主页输入框未输入任何内容时，发送按钮应该处于禁用（disabled）状态。
  输入内容后才会启用。
req_ref: null
priority: P0
channel: web
quad:
  actor: 用户
  action: 观察空状态下的发送按钮
  object: 发送按钮 disabled DOM 属性 + 输入框 value 属性
  preconditions:
    - "主页已加载"
    - "输入框为空（未输入任何字符）"
data_ref: null
steps:
  - {action: nav, path: "http://localhost:55978/"}
  - {action: wait_visible, selector: '[data-testid="workbench-tabs"]', timeout_ms: 8000}
  - {action: wait_visible, selector: 'textarea.uV2eYG_input', timeout_ms: 5000}
  - {action: wait_visible, selector: 'button[aria-label="发送消息"]', timeout_ms: 3000}
assertions:
  - kind: attribute
    selector: 'button[aria-label="发送消息"]'
    name: disabled
    expected: "True"
  - kind: attribute
    selector: 'textarea.uV2eYG_input'
    name: value
    expected: ""
postconditions: []