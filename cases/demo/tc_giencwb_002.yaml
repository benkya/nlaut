id: tc_giencwb_002
title: 顶部tab-点击研发切换主视图到dev-directory
source: |
  口述: 顶部 tab「通用工作台」和「研发」都存在，点击研发后主区内容应切换，
  根 frame 的 data-main-view 属性应从 conversation 变成 dev-directory。
req_ref: null
priority: P0
channel: web
quad:
  actor: 用户
  action: 点击顶部「研发」tab
  object: 根 frame 的 data-main-view 属性 + 通用工作台 4 tab 可见性
  preconditions:
    - "顶部 tabs 已渲染"
    - "默认在通用工作台(conversation 视图)"
data_ref: null
steps:
  - {action: nav, path: "http://localhost:55978/"}
  - {action: wait_visible, selector: '[data-testid="gien-titlebar-tabs"]', timeout_ms: 8000}
  - {action: wait_visible, selector: '[data-testid="workbench-tabs"]', timeout_ms: 5000}
  - {action: click, selector: '[data-testid="gien-titlebar-tabs"] button:nth-of-type(2)'}
  - {action: wait_visible, selector: '[data-testid="gien-titlebar-tabs"] button:nth-of-type(2)', timeout_ms: 3000}
assertions:
  - kind: attribute
    selector: '.pI_x6G_frame'
    name: data:main-view
    expected: "dev"
  - kind: attribute
    selector: '.pI_x6G_frame'
    name: data:sidebar-collapsed
    expected: ""
postconditions: []