id: tc_query_003
title: 查询-按负责人筛选-结果全部属于该负责人
source: "口述: 筛选郑嘉伟的任务，列表里应该都是他的任务"
req_ref: null
priority: P1
channel: web
quad:
  actor: 任务列表页
  action: 按负责人下拉筛选
  object: 负责人筛选器与结果表格
  preconditions:
    - "系统含 6 条郑嘉伟的任务（T003/T008/T013/T018/T023/T028）"
data_ref: null
steps:
  - {action: nav, path: "/tasks"}
  - {action: wait_visible, selector: "#f-owner", timeout_ms: 5000}
  - {action: select_option, selector: "#f-owner", value: "郑嘉伟"}
  - {action: click, selector: "#btn-search"}
  - {action: wait_visible, selector: "table.task-table", timeout_ms: 5000}
assertions:
  - kind: text_visible
    selector: ".result-count"
    expected: "共 6 条结果"
  - kind: text_visible
    selector: "table.task-table"
    expected: "郑嘉伟"
  - kind: visual_state
    prompt: "任务列表筛选负责人'郑嘉伟'后：表格中所有任务的负责人列是否都显示'郑嘉伟'，结果计数为 6 条？只答 yes 或 no。"
    threshold: 0.9
postconditions: []
