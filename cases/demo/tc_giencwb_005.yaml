id: tc_giencwb_005
title: 输入框-输入文字后内容回显且按钮启用
source: |
  口述: 用户在输入框中输入一段文字后：
  1) 输入框 value 属性应包含该文字
  2) 发送按钮 disabled 属性应变为 false
req_ref: null
priority: P0
channel: web
quad:
  actor: 用户
  action: 在输入框中输入文字
  object: 输入框 value 属性 + 发送按钮 disabled 属性
  preconditions:
    - "主页已加载"
    - "输入框为空"
data_ref: null
steps:
  - {action: nav, path: "http://localhost:55978/"}
  - {action: wait_visible, selector: 'textarea.uV2eYG_input', timeout_ms: 8000}
  - {action: fill, selector: 'textarea.uV2eYG_input', value: "自动化测试MVP验证"}
  - {action: wait_visible, selector: 'button[aria-label="发送消息"]', timeout_ms: 3000}
assertions:
  - kind: attribute
    selector: 'textarea.uV2eYG_input'
    name: value
    expected: "自动化测试MVP验证"
  - kind: attribute
    selector: 'button[aria-label="发送消息"]'
    name: disabled
    expected: "False"
postconditions: []