id: tc_login_001
title: 登录-错误密码-停留登录页并提示
source: "口述: 测一下登录，密码错误的情况"
req_ref: null
priority: P0
channel: web
quad:
  actor: 登录页
  action: 提交错误密码
  object: 登录表单
  preconditions:
    - "用户 $user 存在且启用"
data_ref: login_invalid_pwd
steps:
  - {action: nav, path: "/login"}
  - {action: fill, selector: "#username", value: "$user"}
  - {action: fill, selector: "#password", value: "$wrong_pwd"}
  - {action: click, selector: "button[type=submit]"}
  - {action: wait_visible, selector: ".error-msg", timeout_ms: 5000}
assertions:
  - kind: text_visible
    selector: ".error-msg"
    expected: "密码错误"
  - kind: visual_state
    prompt: "页面是否呈现登录失败且仍停留在登录页？"
    threshold: 0.9
  - kind: noul
    question: "当前失败归因是否为'产品缺陷'而非'环境问题'？"
    threshold: 0.9
postconditions:
  - cleanup_tag: TEST_AUTO_
