# D02 逻辑推理
d02_syllogism:
  prompt: "所有人都会死。苏格拉底是人。苏格拉底会死吗？请回答是或否并说明理由。"
  expected: "是"
d02_time_seq:
  prompt: "A比B高，B比C高，C比D高。谁最矮？"
  expected: "D"

# D04 数学计算
d04_multi_step:
  prompt: "一个商品原价200元，先打8折，再用30元优惠券，最终价格是多少？"
  expected: "130"
d04_app_problem:
  prompt: "甲乙两人同时从A地出发去B地，甲速60km/h，乙速40km/h，AB相距120km。甲到B地后立即返回，多久后和乙相遇？"
  expected: "2.4"

