[project]
name = "nlaut"
version = "0.1.0"
description = "Natural-language Automation Testing framework: NL in -> IR (cases/) -> derived pytest/Playwright code (gen/) -> 3-tier judging -> evidence-chained reports"
requires-python = ">=3.11"
dependencies = [
    "hf-transfer>=0.1.9",
    "laya-mlx>=0.2.0",
    "mlx-lm>=0.31.3",
    "mlx-vlm>=0.7.2",
    "modelscope>=1.40.1",
    "playwright>=1.63.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlaut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not mlx'"
markers = [
    "mlx: 需要本机 MLX 权重的真实推理集成测试（默认跳过，-m mlx 显式开启）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
