<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: -apple-system, sans-serif; background: #eceef1; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 360px; text-align: center; }
  .icon { font-size: 48px; margin-bottom: 12px; }
  .title { font-size: 18px; color: #333; margin: 0 0 8px; }
  .desc { font-size: 13px; color: #888; line-height: 1.6; }
  .retry { margin-top: 20px; padding: 10px 28px; background: #6b7280; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .offline { margin-top: 16px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <p class="title">网络异常</p>
    <p class="desc">网络连接失败，请检查网络后重试<br>(ERR_CONNECTION_TIMED_OUT)</p>
    <button class="retry">重新连接</button>
    <p class="offline">当前处于离线状态 · 2026-09-23 02:20</p>
  </div>
</body>
</html>
