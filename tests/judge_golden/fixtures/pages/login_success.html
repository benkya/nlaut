<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f6f8; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 360px; text-align: center; }
  .banner { background: #e8f7ee; color: #1a7f37; border: 1px solid #b7e4c7; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 600; }
  .title { font-size: 20px; margin: 16px 0 8px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  .menu { list-style: none; padding: 0; margin: 0; text-align: left; }
  .menu li { padding: 10px 12px; border-radius: 6px; background: #f0f2f5; margin-bottom: 8px; font-size: 14px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: #1a7f37; color: #fff; line-height: 56px; margin: 0 auto 12px; font-size: 24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">张</div>
    <div class="banner">✓ 登录成功，欢迎回来</div>
    <div class="title">工作台</div>
    <div class="sub">zhangpeng@example.com · 管理员</div>
    <ul class="menu">
      <li>📊 空间概览</li>
      <li>📁 我的文件</li>
      <li>🤖 智能体广场</li>
      <li>⚙️ 系统设置</li>
    </ul>
  </div>
</body>
</html>
