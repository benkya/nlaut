<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: -apple-system, sans-serif; background: #f5f6f8; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 16px rgba(0,0,0,.08); width: 360px; }
  h1 { font-size: 20px; text-align: center; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d0d3d9; border-radius: 6px; font-size: 14px; }
  .error-msg { background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-top: 16px; }
  button { width: 100%; margin-top: 16px; padding: 12px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>账号登录</h1>
    <label for="username">用户名</label>
    <input id="username" type="text" value="zhangpeng">
    <label for="password">密码</label>
    <input id="password" type="password" value="••••••">
    <div class="error-msg">⚠ 用户名或密码错误，请重新输入</div>
    <button type="submit">登 录</button>
  </div>
</body>
</html>
